<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" width="560" height="440" role="img" aria-label="Bifrost Media Server">
    <defs>
        <linearGradient id="bifrostLoginWordmark" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#55e8ff"/>
            <stop offset="0.32" stop-color="#4b9cff"/>
            <stop offset="0.67" stop-color="#936cff"/>
            <stop offset="1" stop-color="#df63dc"/>
        </linearGradient>
        <linearGradient id="bifrostLoginArc" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#55e8ff"/>
            <stop offset="0.35" stop-color="#4b9cff"/>
            <stop offset="0.7" stop-color="#936cff"/>
            <stop offset="1" stop-color="#df63dc"/>
        </linearGradient>
    </defs>

    <!-- Scattered stars behind the bridge -->
    <g fill="#f5f8ff">
        <circle cx="74" cy="92" r="2" opacity="0.55"/>
        <circle cx="168" cy="48" r="1.6" opacity="0.4"/>
        <circle cx="292" cy="36" r="2.2" opacity="0.5"/>
        <circle cx="418" cy="74" r="1.6" opacity="0.38"/>
        <circle cx="496" cy="132" r="2" opacity="0.45"/>
        <circle cx="46" cy="186" r="1.8" opacity="0.35"/>
        <circle cx="516" cy="238" r="1.6" opacity="0.3"/>
    </g>

    <!-- The rainbow bridge -->
    <g fill="none" stroke="url(#bifrostLoginArc)" stroke-linecap="round">
        <path d="M44 300 A 236 236 0 0 1 516 300" stroke-width="11" opacity="0.95"/>
        <path d="M78 300 A 202 202 0 0 1 482 300" stroke-width="11" opacity="0.62"/>
        <path d="M112 300 A 168 168 0 0 1 448 300" stroke-width="11" opacity="0.34"/>
    </g>

    <text x="280" y="372" text-anchor="middle" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="10" fill="url(#bifrostLoginWordmark)">BIFROST</text>
    <text x="280" y="410" text-anchor="middle" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" letter-spacing="9" fill="#aeb8c8">MEDIA SERVER</text>
</svg>
