<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 88" width="360" height="88" role="img" aria-label="Bifrost">
    <defs>
        <linearGradient id="bifrostHeaderWordmark" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#55e8ff"/>
            <stop offset="0.32" stop-color="#4b9cff"/>
            <stop offset="0.67" stop-color="#936cff"/>
            <stop offset="1" stop-color="#df63dc"/>
        </linearGradient>
    </defs>

    <!-- The bridge: three arcs stepping through the Bifrost gradient -->
