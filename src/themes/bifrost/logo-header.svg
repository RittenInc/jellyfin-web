        <path d="M19 68 A 25 25 0 0 1 69 68" stroke="#936cff" stroke-width="5" opacity="0.85"/>
        <path d="M30 68 A 14 14 0 0 1 58 68" stroke="#df63dc" stroke-width="5" opacity="0.7"/>
    </g>

    <text x="104" y="63" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="42" font-weight="700" letter-spacing="5" fill="url(#bifrostHeaderWordmark)">BIFROST</text>
</svg>
